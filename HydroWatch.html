<!DOCTYPE html>
<html lang="fr">
<head>
<title>HydroWatch</title>
<style>
body{font-family:Arial;text-align:center;background:#eef5ef;padding:20px}
h1{color:green}
.carte{background:white;padding:12px;margin:10px;border-radius:8px}
.alerte{color:red;border:2px solid red}
#journal{color:red}
</style>
</head>
<body>
<h1>HydroWatch - Grow It Yourself</h1>
<h3 id="status">Tout est normal</h3>
<div id="result"></div><h3>Journal des alertes</h3><div id="journal"></div>
<script>
let p=[["pH",5.5,6.5],["Température",18,28],["Humidité",50,70]];
function check(){let a=[];result.innerHTML=p.map(([n,min,max])=>{let v=+(min+Math.random()*(max-min+4)-2).toFixed(1),bad=v<min||v>max;if(bad)a.push(n+" : "+v);return `<div class="carte ${bad?'alerte':''}">${n}: ${v} (${min}-${max}) ${bad?'⚠️':'✅'}</div>`}).join("");status.textContent=a.length?"ALERTE : "+a.join(", "):"Tout est normal";if(a.length)journal.innerHTML="<p>"+new Date().toLocaleTimeString()+" : "+a.join(", ")+"</p>"+journal.innerHTML}
check();setInterval(check,3000);
</script>
</body>
</html>
